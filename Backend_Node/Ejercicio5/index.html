<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Web</title>
  <style>
    /* Estilos para la página */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .contenedor {
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      color: #764ba2;
      margin-bottom: 10px;
    }

    h2 {
      color: #667eea;
      font-weight: normal;
      margin-bottom: 20px;
    }

    p {
      line-height: 1.6;
      font-size: 16px;
      color: #555;
    }

    img {
      border-radius: 10px;
      margin-top: 20px;
      max-width: 100%;
      height: auto;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Bienvenido al Servidor Backend</h1>
    <h2>Estudiante: Duvan Alquichides</h2> 
    <p>
      Este sitio fue enviado desde Node.js y Express. 
      Aquí puedes ver cómo el backend puede servir una página web completa 
      con estilos, imágenes y contenido dinámico.
    </p>
    <img src="https://picsum.photos/400/200" alt="Imagen de ejemplo">
    <div class="footer">
      Servidor Express funcionando correctamente ✅
    </div>
  </div>
</body>
</html>
